<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #ff4b5c;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .start-date {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .heart {
            font-size: 40px;
            color: #ff4b5c;
            animation: pulse 1.2s infinite;
            margin-bottom: 15px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .timer-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .time-box {
            background: #ffffff;
            padding: 15px 5px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .time-box .number {
            font-size: 22px;
            font-weight: bold;
            color: #ff4b5c;
            display: block;
        }

        .time-box .label {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>တို့နှစ်ယောက် ချစ်သူသက်တမ်း</h1>
        <div class="start-date">စတင်ခဲ့သည့်နေ့ - 04.07.2023</div>

        <div class="timer-container">
            <div class="time-box">
                <span class="number" id="years">0</span>
                <span class="label">နှစ်</span>
            </div>
            <div class="time-box">
                <span class="number" id="months">0</span>
                <span class="label">လ</span>
            </div>
            <div class="time-box">
                <span class="number" id="days">0</span>
                <span class="label">ရက်</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">0</span>
                <span class="label">နာရီ</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">0</span>
                <span class="label">မိနစ်</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">0</span>
                <span class="label">စက္ကန့်</span>
            </div>
        </div>
    </div>

    <script>
        // စတင်ခဲ့သည့်နေ့: July 4, 2023 00:00:00
        const startDate = new Date(2023, 6, 4, 0, 0, 0); 

        function updateCounter() {
            const now = new Date();

            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            let hours = now.getHours() - startDate.getHours();
            let minutes = now.getMinutes() - startDate.getMinutes();
            let seconds = now.getSeconds() - startDate.getSeconds();

            // အနုတ်ပြလျှင် ညှိယူခြင်း
            if (seconds < 0) {
                seconds += 60;
                minutes--;
            }
            if (minutes < 0) {
                minutes += 60;
                hours--;
            }
            if (hours < 0) {
                hours += 24;
                days--;
            }
            if (days < 0) {
                // လွန်ခဲ့သောလ၏ ရက်ပေါင်းကို ယူရန်
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
                months--;
            }
            if (months < 0) {
                months += 12;
                years--;
            }

            // UI တွင် ပြသခြင်း
            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        setInterval(updateCounter, 1000);
        updateCounter();
    </script>

</body>
</html>
